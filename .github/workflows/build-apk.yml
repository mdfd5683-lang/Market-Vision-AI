name: Build APK from ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Unzip project
        run: unzip -q "remix-live-screen-analyzer.zip" -d src

      - name: Find project directory
        run: |
          PROJECT_DIR=$(dirname "$(find src -maxdepth 6 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
      - name: Patch project for CI (fix signing + google services)
        run: |
          for f in "$PROJECT_DIR/app/build.gradle.kts" "$PROJECT_DIR/app/build.gradle"; do
            if [ -f "$f" ]; then
              echo "Patching $f"

              # Remove Google Services plugin (google-services.json missing issue)
              sed -i '/com.google.gms.google-services/d' "$f"
              sed -i '/google-services/d' "$f"

              # Fix debug signing (use default debug keystore instead of missing src/debug.keystore)
              sed -i 's/getByName("debugConfig")/getByName("debug")/g' "$f"
              sed -i 's/signingConfigs\["debugConfig"\]/signingConfigs["debug"]/g' "$f"
            fi
          done
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

      - name: Download Gradle from wrapper properties (no gradlew needed)
        run: |
          GRADLE_URL=$(grep -E '^distributionUrl=' "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" | cut -d= -f2- | sed 's#\\:#:#g')
          wget -q "$GRADLE_URL" -O gradle.zip
          unzip -q gradle.zip -d $HOME/gradle
          GRADLE_DIR=$(find $HOME/gradle -maxdepth 1 -type d -name "gradle-*" | head -n 1)
          echo "$GRADLE_DIR/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
